apiVersion: v1
kind: Secret
metadata:
  name: bikez-crawler-secrets
type: Opaque
stringData:
  MONGODB_URL: mongodb+srv://<username>:<password>@<endpoint>/bikez?appName=Cluster0
  S3_ENDPOINT: https://example.com
  S3_ACCESS_KEY: <access_key>
  S3_SECRET_KEY: <secret_key>
  S3_RAW_BUCKET: bikez-crawler-pending
  S3_PRODUCTION_BUCKET: bikez-crawler
  S3_REGION: us-east-1
